name: Generate gRPC Code

on:
  push:
    paths:
      - 'Protos/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate gRPC client code
        run: npm run generate

      - name: Verify build compiles
        run: npm run build

      - name: Commit and push changes if any
        run: |
          if [ -n "$(git status --porcelain src/generated/)" ]; then
            echo "Changes detected in src/generated/."
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add src/generated/
            git commit -m "chore: auto-generate gRPC client code [skip ci]"
            git push
          else
            echo "No changes detected in src/generated/."
          fi
